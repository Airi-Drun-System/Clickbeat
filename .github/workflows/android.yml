name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap add android
      # иконка: кольцо из build/icon.png во все плотности, адаптивную убираем
      - name: Icons, landscape, fullscreen
        run: |
          set -e
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert build/icon.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png
            cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_round.png
            rm -f $R/mipmap-$n/ic_launcher_foreground.png
          done
          # заставка Capacitor -> тёмный фон с кольцом
          for f in $(find $R -name splash.png); do
            w=$(identify -format %w $f); h=$(identify -format %h $f); i=$(( (w<h?w:h)/3 ))
            convert -size ${w}x${h} xc:'#0b0b10' \( build/icon.png -resize ${i}x${i} \) -gravity center -composite $f
          done
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"/' $M
          grep -q sensorLandscape $M
          S=$R/values/styles.xml
          sed -i 's#<item name="windowNoTitle">true</item>#<item name="windowNoTitle">true</item>\n        <item name="android:windowFullscreen">true</item>#' $S
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Clickbeat-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Clickbeat — Android
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Тестовая сборка Clickbeat для Android (APK, ставится вручную).
            Играть можно пальцами, а если подключить мышку и клавиатуру — как на ПК (Z/X или кнопки мыши).
            Коммит: ${{ github.sha }}
          files: Clickbeat-android.apk
